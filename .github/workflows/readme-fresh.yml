name: Atualização do README

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Checar tipos do gerador
        run: npx tsc -p internal/tsconfig.json
      - name: Regenerar o README
        run: npm run generate
      - name: Falhar se o README.md estiver fora de sincronia
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "README.md está fora de sincronia com dictionary/, internal/Curriculum.md ou internal/README.template.md."
            echo "Execute: npm run generate e faça commit do resultado."
            exit 1
          fi
